{% extends 'base.html' %}

{% block title %}Mis entradas{% endblock %}

{% block content %}
<h1 class="main__title">Mis entradas</h1>
<ul class="cards-list stacked">
  {% for el in cards %}
  <li class="card">
    <a class="card__link" href="/card/{{el.id}}">
      <img class="card__img" src="{{ url_for('static', filename='img/documento.svg') }}" width="250" height="250" alt="post_icon">
      <div class="card__text">
        <h2 class="card__title">{{el.title}}</h2>
        <p class="card__subtitle">{{el.subtitle}}</p>
      </div>
    </a>
  </li>
{% endfor %}
  <li class="card card--creat">
    <a class="creat__link" href="{{ url_for('create') }}" aria-label="Crear nueva entrada">
      <svg class="creat__icon" width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M12 5v14" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 12h14" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </li>
</ul>
{% endblock %}
